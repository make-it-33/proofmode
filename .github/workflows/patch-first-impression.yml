name: patch-first-impression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-first-impression.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make the V6 hero visible on first paint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path("apps/web/src/routes/WebsiteRoute.tsx")
          source = route.read_text()
          old_image = '<img src={src} alt={label ?? ""} decoding="async" />'
          new_image = '''<img
                  src={src}
                  alt={label ?? ""}
                  loading="eager"
                  fetchPriority="high"
                  decoding="sync"
                />'''
          if old_image not in source:
              raise SystemExit("Expected hero image markup was not found")
          route.write_text(source.replace(old_image, new_image, 1))

          index = Path("apps/web/index.html")
          html = index.read_text()
          old_meta = '    <meta name="color-scheme" content="dark" />'
          preload = '''    <meta name="color-scheme" content="dark" />
              <link
                rel="preload"
                as="image"
                href="./media/human-reference.webp"
                type="image/webp"
                fetchpriority="high"
              />'''
          if old_meta not in html:
              raise SystemExit("Expected color-scheme metadata was not found")
          index.write_text(html.replace(old_meta, preload, 1))
          PY
          rm -f .github/workflows/patch-first-impression.yml

      - name: Commit first-impression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --no-verify -m "fix(site): show image and proof in the opening frame"
          git push origin HEAD:main
