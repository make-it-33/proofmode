name: Bug report
description: Report reproducible broken behavior.
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and environment
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User, scoring, fairness, or security impact
    validations:
      required: true
