services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proofmode
      POSTGRES_USER: proofmode
      POSTGRES_PASSWORD: proofmode
    ports: ["5432:5432"]
    volumes: ["proofmode_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofmode"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["proofmode_redis:/data"]
volumes:
  proofmode_postgres:
  proofmode_redis:
